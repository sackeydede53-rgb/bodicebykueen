<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="title desc">
  <title id="title">Size Chart</title>
  <desc id="desc">S 6-8, M 10-12, L 12-14, XL 14-16, XXL 16-18. UK / GH measurements.</desc>

  <rect width="720" height="780" fill="#ffffff"/>

  <!-- Header banner -->
  <rect x="40" y="36" width="640" height="118" fill="#e18aa0"/>
  <line x1="78" y1="62" x2="642" y2="62" stroke="#ffffff" stroke-width="3"/>
  <text x="360" y="112" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="4">SIZE CHART</text>
  <line x1="78" y1="132" x2="642" y2="132" stroke="#ffffff" stroke-width="3"/>

  <!-- Table -->
  <rect x="70" y="190" width="580" height="480" fill="#ffffff" stroke="#e18aa0" stroke-width="4"/>

  <!-- Header row -->
  <rect x="70" y="190" width="580" height="78" fill="#e18aa0"/>
  <line x1="360" y1="190" x2="360" y2="670" stroke="#e18aa0" stroke-width="4"/>
  <text x="215" y="240" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">SIZE</text>
  <text x="505" y="240" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">UK / GH SIZE</text>

  <!-- Rows -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2f2f2f">
    <line x1="70" y1="268" x2="650" y2="268" stroke="#e18aa0" stroke-width="3"/>
    <text x="215" y="318" text-anchor="middle">S</text>
    <text x="505" y="318" text-anchor="middle">6  8</text>

    <line x1="70" y1="348" x2="650" y2="348" stroke="#e18aa0" stroke-width="3"/>
    <text x="215" y="398" text-anchor="middle">M</text>
    <text x="505" y="398" text-anchor="middle">10  12</text>

    <line x1="70" y1="428" x2="650" y2="428" stroke="#e18aa0" stroke-width="3"/>
    <text x="215" y="478" text-anchor="middle">L</text>
    <text x="505" y="478" text-anchor="middle">12  14</text>

    <line x1="70" y1="508" x2="650" y2="508" stroke="#e18aa0" stroke-width="3"/>
    <text x="215" y="558" text-anchor="middle">XL</text>
    <text x="505" y="558" text-anchor="middle">14  16</text>

    <line x1="70" y1="588" x2="650" y2="588" stroke="#e18aa0" stroke-width="3"/>
    <text x="215" y="638" text-anchor="middle">XXL</text>
    <text x="505" y="638" text-anchor="middle">16  18</text>
  </g>

  <text x="360" y="730" text-anchor="middle" fill="#555555" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic">Please note: Sizes are in UK / GH measurements.</text>
</svg>
